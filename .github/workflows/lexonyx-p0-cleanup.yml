name: Lexonyx Phase 1 P0 cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lexonyx-p0-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python scripts/lexonyx_p0_cleanup.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Finish Phase 1 P0 cleanup"
            git push
          fi
