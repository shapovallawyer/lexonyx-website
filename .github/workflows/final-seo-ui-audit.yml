name: Final SEO UI Audit

on:
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run production build and audit
        run: |
          node scripts/static-source-cleanup.mjs
          node scripts/editorial-cleanup.mjs
          node scripts/final-legal-cleanup.mjs
          node scripts/final-i18n-marketing-cleanup.mjs
          node scripts/final-fixes.mjs
          node scripts/final-content-sanitizer.mjs
          node scripts/layout-normalizer.mjs
          node scripts/normalize-i18n-map.mjs
          node scripts/ru-common-ui-curation.mjs
          node scripts/ru-core-language-curation.mjs
          node scripts/ru-core-language-postfix.mjs
          node scripts/ru-core-second-pass.mjs
          node scripts/ru-core-third-pass.mjs
          node scripts/ru-core-final-polish.mjs
          node scripts/ru-core-last-mile.mjs
          node scripts/ru-insights-language-curation.mjs
          node scripts/ru-insights-final-polish.mjs
          node scripts/ru-remaining-language-curation.mjs
          node scripts/ru-remaining-final-polish.mjs
          node scripts/ru-editorial-curation.mjs
          node scripts/jurisdiction-ui-fix.mjs
          node scripts/final-production-check.mjs
          node scripts/seo-ui-audit.mjs
          node scripts/ru-mixed-script-audit.mjs
          node scripts/ru-jurisdiction-editorial-audit.mjs
          node scripts/ru-core-editorial-audit.mjs
          node scripts/ru-insights-editorial-audit.mjs
          node scripts/ru-remaining-editorial-audit.mjs
