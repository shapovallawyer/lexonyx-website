name: Final SEO UI Audit

on:
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install rendered-layout audit dependency
        run: npm install --no-save puppeteer-core@24
      - name: Run production build and audit
        run: |
          node scripts/static-source-cleanup.mjs
          node scripts/editorial-cleanup.mjs
          node scripts/final-legal-cleanup.mjs
          node scripts/final-i18n-marketing-cleanup.mjs
          node scripts/final-fixes.mjs
          node scripts/final-content-sanitizer.mjs
          node scripts/layout-normalizer.mjs
          node scripts/normalize-i18n-map.mjs
          node scripts/final-seo-source-normalizer.mjs
          node scripts/ru-common-ui-curation.mjs
          node scripts/ru-core-language-curation.mjs
          node scripts/ru-core-language-postfix.mjs
          node scripts/ru-core-second-pass.mjs
          node scripts/ru-core-third-pass.mjs
          node scripts/ru-core-final-polish.mjs
          node scripts/ru-core-last-mile.mjs
          node scripts/ru-insights-language-curation.mjs
          node scripts/ru-insights-final-polish.mjs
          node scripts/ru-remaining-language-curation.mjs
          node scripts/ru-remaining-final-polish.mjs
          node scripts/ru-remaining-last-mile.mjs
          node scripts/ru-editorial-curation.mjs
          node scripts/ru-insights-manual-editorial-pass.mjs
          node scripts/ru-auxiliary-manual-editorial-pass.mjs
          node scripts/ru-four-page-manual-editorial-pass.mjs
          node scripts/jurisdiction-ui-fix.mjs
          node scripts/ru-final-visual-fixes.mjs
          node scripts/ru-runtime-copy-polish.mjs
          node scripts/ru-final-copy-qa.mjs
          node scripts/en-editorial-curation.mjs
          node scripts/en-runtime-copy-polish.mjs
          node scripts/en-final-editorial-polish.mjs
          node scripts/en-final-copy-qa.mjs
          node scripts/uk-editorial-curation.mjs
          node scripts/uk-runtime-copy-polish.mjs
          node scripts/uk-final-editorial-polish.mjs
          node scripts/uk-final-copy-qa.mjs
          node scripts/i18n-page-parity-fix.mjs
          node scripts/commercial-entry-point-refinement.mjs
          node scripts/commercial-entry-point-qa.mjs
          node scripts/client-journey-refinement.mjs
          node scripts/client-journey-ru-language-patch.mjs
          node scripts/client-journey-analytics-patch.mjs
          node scripts/client-journey-qa.mjs
          node scripts/commercial-meta-refinement.mjs
          node scripts/analytics-instrumentation.mjs
          node scripts/conversion-seo-qa.mjs
          node scripts/i18n-page-parity-audit.mjs
          node scripts/final-production-check.mjs
          node scripts/seo-ui-audit.mjs
          node scripts/ru-mixed-script-audit.mjs
          node scripts/ru-jurisdiction-editorial-audit.mjs
          node scripts/ru-core-editorial-audit.mjs
          node scripts/ru-insights-editorial-audit.mjs
          node scripts/ru-remaining-editorial-audit.mjs
          node scripts/ru-live-layout-audit.mjs
          node scripts/en-live-layout-audit.mjs
          node scripts/uk-live-layout-audit.mjs
      - name: Upload RU layout QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ru-layout-qa
          path: artifacts/ru-layout-qa
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload EN layout QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: en-layout-qa
          path: artifacts/en-layout-qa
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload UK layout QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uk-layout-qa
          path: artifacts/uk-layout-qa
          if-no-files-found: ignore
          retention-days: 7
