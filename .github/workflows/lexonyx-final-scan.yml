name: Lexonyx final compliance scan

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lexonyx-final-scan.yml'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch remaining perimeter metadata and generate scan
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def rep(path, old, new, required=False):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if old not in s:
                  if required: raise SystemExit(f'missing in {path}: {old[:100]}')
                  return 0
              n=s.count(old); p.write_text(s.replace(old,new),encoding='utf-8'); print(path,n); return n

          # UK homepage structured-data perimeter.
          p='uk/index.html'
          rep(p,'"Податкове резидентство і КІК",','"Fact mapping податкового резидентства і КІК та координація профільних фахівців",')
          rep(p,'"VAT і транскордонні моделі",','"VAT transaction mapping та координація профільних фахівців",')
          rep(p,'"Ризик постійного представництва",','"PE-risk fact mapping та координація профільних фахівців",')
          rep(p,'"Регуляторна архітектура",','"Regulatory scoping та координація профільних фахівців",')

          # Sensitive-page x-default should follow EN default architecture.
          pairs={
            'en/expertise/tax-residency-cfc.html':'https://lexonyx.com/en/expertise/tax-residency-cfc.html',
            'en/expertise/vat-cross-border.html':'https://lexonyx.com/en/expertise/vat-cross-border.html',
            'en/expertise/pe-risk-international-teams.html':'https://lexonyx.com/en/expertise/pe-risk-international-teams.html',
            'en/expertise/regulatory-licensing.html':'https://lexonyx.com/en/expertise/regulatory-licensing.html',
            'uk/ekspertyza/podatkove-rezydentstvo-ta-kik.html':'https://lexonyx.com/en/expertise/tax-residency-cfc.html',
            'uk/ekspertyza/vat-ta-transkordonni-modeli.html':'https://lexonyx.com/en/expertise/vat-cross-border.html',
            'uk/ekspertyza/pe-ryzyk-ta-mizhnarodni-komandy.html':'https://lexonyx.com/en/expertise/pe-risk-international-teams.html',
            'uk/ekspertyza/regulyatorna-arhitektura-ta-litsenzuvannya.html':'https://lexonyx.com/en/expertise/regulatory-licensing.html',
          }
          for path,target in pairs.items():
              p=Path(path); s=p.read_text(encoding='utf-8')
              ns,n=re.subn(r'<link rel="alternate" hreflang="x-default" href="[^"]+"\s*/?>', f'<link rel="alternate" hreflang="x-default" href="{target}" />', s, count=1)
              if n: p.write_text(ns,encoding='utf-8')

          # Direct-service wording in EN tax FAQ deliverable.
          rep('en/expertise/tax-residency-cfc.html',
              'The client receives a map of actual management and control, an assessment of CFC exposure and areas of personal tax risk, a list of red flags relating to residency and ownership, recommendations for aligning management and governance, and an understanding of how this part connects with PE-risk, VAT and Banking Readiness.',
              'The LEXONYX deliverable includes a map of actual management and control, factual red flags relating to residency and ownership, governance-alignment recommendations and a coordination brief showing the interfaces with PE-risk, VAT and Banking Readiness. Jurisdiction-specific CFC and personal-tax conclusions are provided or confirmed by appropriately qualified tax professionals in the relevant jurisdictions.')

          # Correct remaining JSON-LD language markers in EN/UK sensitive and CTA pages.
          for path in list(pairs)+['en/request-review.html','uk/zapytaty-rozbir.html']:
              lang='uk' if path.startswith('uk/') else 'en'
              p=Path(path); s=p.read_text(encoding='utf-8')
              s=re.sub(r'"inLanguage"\s*:\s*"ru"', f'"inLanguage":"{lang}"', s)
              p.write_text(s,encoding='utf-8')

          # Build an auditable lexical scan report across active EN/UK/RU HTML.
          patterns=[
            r'legal advice', r'tax advice', r'legal services', r'tax services',
            r'we advise', r'we assess', r'we provide legal', r'we provide tax',
            r'надаємо юрид', r'надаємо податков', r'оказываем юрид', r'оказываем налог',
            r'податкові консультац', r'налогов.*консультац'
          ]
          rx=re.compile('|'.join(f'(?:{x})' for x in patterns),re.I)
          out=['LEXONYX FINAL LEXICAL COMPLIANCE SCAN','Generated by one-shot workflow.','']
          hits=0
          for root in ['ru','en','uk']:
              for p in sorted(Path(root).rglob('*.html')):
                  for i,line in enumerate(p.read_text(encoding='utf-8',errors='replace').splitlines(),1):
                      if rx.search(line):
                          hits+=1; out.append(f'{p}:{i}: {line.strip()}')
          out.insert(2,f'HITS={hits}')
          Path('docs/LEXONYX_FINAL_COMPLIANCE_SCAN.txt').write_text('\n'.join(out)+'\n',encoding='utf-8')

          Path('.github/workflows/lexonyx-final-scan.yml').unlink()
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "lexonyx-compliance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Complete final perimeter patch and lexical compliance scan"
          git push
