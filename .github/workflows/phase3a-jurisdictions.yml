name: Phase 3A jurisdiction architecture

on:
  push:
    paths:
      - '.github/workflows/phase3a-jurisdictions.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply jurisdiction architecture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          core_desktop = '''<h4>Ключевые</h4>
                  <a href="/ru/yurisdikcii/ukraina.html"><span class="jur-code">UA</span> Украина</a>
                  <a href="/ru/yurisdikcii/germaniya.html"><span class="jur-code">DE</span> Германия</a>
                  <a href="/ru/yurisdikcii/kipr.html"><span class="jur-code">CY</span> Кипр</a>
                  <a href="/ru/yurisdikcii/polsha.html"><span class="jur-code">PL</span> Польша</a>
                  <a href="/ru/yurisdikcii/niderlandy.html"><span class="jur-code">NL</span> Нидерланды</a>
                  <a href="/ru/yurisdikcii/oae.html"><span class="jur-code">AE</span> ОАЭ</a>'''
          add_desktop = '''<h4>Дополнительные</h4>
                  <a href="/ru/yurisdikcii/estoniya.html"><span class="jur-code">EE</span> Эстония</a>
                  <a href="/ru/yurisdikcii/irlandiya.html"><span class="jur-code">IE</span> Ирландия</a>
                  <a href="/ru/yurisdikcii/velikobritaniya.html"><span class="jur-code">UK</span> Великобритания</a>
                  <a href="/ru/yurisdikcii/shveycariya.html"><span class="jur-code">CH</span> Швейцария</a>'''

          core_mobile = '''<div class="mobile-sub-group-title">Ключевые</div>
            <a href="/ru/yurisdikcii/ukraina.html" class="mobile-sub-link">Украина</a>
            <a href="/ru/yurisdikcii/germaniya.html" class="mobile-sub-link">Германия</a>
            <a href="/ru/yurisdikcii/kipr.html" class="mobile-sub-link">Кипр</a>
            <a href="/ru/yurisdikcii/polsha.html" class="mobile-sub-link">Польша</a>
            <a href="/ru/yurisdikcii/niderlandy.html" class="mobile-sub-link">Нидерланды</a>
            <a href="/ru/yurisdikcii/oae.html" class="mobile-sub-link">ОАЭ</a>'''
          add_mobile = '''<div class="mobile-sub-group-title">Дополнительные</div>
            <a href="/ru/yurisdikcii/estoniya.html" class="mobile-sub-link">Эстония</a>
            <a href="/ru/yurisdikcii/irlandiya.html" class="mobile-sub-link">Ирландия</a>
            <a href="/ru/yurisdikcii/velikobritaniya.html" class="mobile-sub-link">Великобритания</a>
            <a href="/ru/yurisdikcii/shveycariya.html" class="mobile-sub-link">Швейцария</a>'''

          desktop_first = re.compile(r'<h4>ЕС</h4>\s*<a href="/ru/yurisdikcii/kipr\.html".*?<a href="/ru/yurisdikcii/chehiya\.html"[^>]*>.*?</a>', re.S)
          desktop_second = re.compile(r'<h4>Великобритания и другие</h4>\s*<a href="/ru/yurisdikcii/velikobritaniya\.html".*?<a href="/ru/yurisdikcii/shveycariya\.html"[^>]*>.*?</a>', re.S)
          mobile_first = re.compile(r'<div class="mobile-sub-group-title">ЕС</div>\s*<a href="/ru/yurisdikcii/kipr\.html".*?<a href="/ru/yurisdikcii/chehiya\.html"[^>]*>.*?</a>', re.S)
          mobile_second = re.compile(r'<div class="mobile-sub-group-title">Великобритания и другие</div>\s*<a href="/ru/yurisdikcii/velikobritaniya\.html".*?<a href="/ru/yurisdikcii/shveycariya\.html"[^>]*>.*?</a>', re.S)

          changed = []
          for p in root.joinpath('ru').rglob('*.html'):
              s = p.read_text(encoding='utf-8')
              old = s
              s = desktop_first.sub(core_desktop, s)
              s = desktop_second.sub(add_desktop, s)
              s = mobile_first.sub(core_mobile, s)
              s = mobile_second.sub(add_mobile, s)
              if s != old:
                  p.write_text(s, encoding='utf-8')
                  changed.append(str(p))

          # Rebuild RU jurisdiction hub main/SEO while preserving header/footer.
          hub = root/'ru/yurisdikcii/index.html'
          s = hub.read_text(encoding='utf-8')
          s = re.sub(r'<title>.*?</title>', '<title>Юрисдикции и структурные сценарии — LEXONYX</title>', s, count=1, flags=re.S)
          s = re.sub(r'<meta name="description"\s*content=".*?">', '<meta name="description" content="Юрисдикции и структурные сценарии для международного бизнеса. LEXONYX сначала определяет функцию компании, management, people, banking и business objective, а затем сравнивает подходящие юрисдикции.">', s, count=1, flags=re.S)
          s = re.sub(r'<meta property="og:title" content=".*?">', '<meta property="og:title" content="Юрисдикции и структурные сценарии — LEXONYX">', s, count=1)
          s = re.sub(r'<meta property="og:description"\s*content=".*?">', '<meta property="og:description" content="Страна — не стратегия. Сначала функция entity, operational reality и ограничения; затем выбор юрисдикции.">', s, count=1, flags=re.S)
          s = re.sub(r'<meta name="twitter:title" content=".*?">', '<meta name="twitter:title" content="Юрисдикции и структурные сценарии — LEXONYX">', s, count=1)
          s = re.sub(r'<meta name="twitter:description"\s*content=".*?">', '<meta name="twitter:description" content="Decision-support library по ключевым юрисдикциям международного бизнеса.">', s, count=1, flags=re.S)

          main = '''<main id="main-content">
    <section class="section section-dark">
      <div class="container container-narrow">
        <nav class="breadcrumbs breadcrumbs-on-dark" aria-label="Breadcrumb"><a href="/ru/index.html">Главная</a><span class="separator">›</span><span class="current">Юрисдикции</span></nav>
        <div class="section-label">JURISDICTION DECISION SUPPORT</div>
        <h1 class="page-title page-title-wide">Юрисдикции и структурные сценарии</h1>
        <p class="page-subtitle page-subtitle-wide"><strong>Страна — не стратегия.</strong> Сначала мы определяем роль entity, management, functions, people, banking, investor и regulatory requirements. Только после этого сравниваем юрисдикции, способные поддержать Target State.</p>
      </div>
    </section>

    <section class="section section-light">
      <div class="container">
        <div class="section-header-centered"><div class="section-label">КЛЮЧЕВЫЕ ЮРИСДИКЦИИ</div><h2 class="section-title-main">Основные структурные сценарии</h2></div>
        <div class="jur-relevance-grid">
          <a class="jur-relevance-card" href="/ru/yurisdikcii/ukraina.html"><h4>Украина</h4><p>Ukrainian law · ownership · internationalisation · Ukraine–EU matters</p></a>
          <a class="jur-relevance-card" href="/ru/yurisdikcii/germaniya.html"><h4>Германия</h4><p>Operating reality · management · founders · German nexus</p></a>
          <a class="jur-relevance-card" href="/ru/yurisdikcii/kipr.html"><h4>Кипр</h4><p>HoldCo · ownership · IP workstreams · international structures</p></a>
          <a class="jur-relevance-card" href="/ru/yurisdikcii/polsha.html"><h4>Польша</h4><p>Workforce · DevelopmentCo · OpCo · Ukraine–EU expansion</p></a>
          <a class="jur-relevance-card" href="/ru/yurisdikcii/niderlandy.html"><h4>Нидерланды</h4><p>Investor HoldCo · group ownership · acquisitions · governance</p></a>
          <a class="jur-relevance-card" href="/ru/yurisdikcii/oae.html"><h4>ОАЭ</h4><p>Founder relocation · operating company · MENA · holding</p></a>
        </div>
      </div>
    </section>

    <section class="section section-dark">
      <div class="container">
        <div class="section-header-centered"><div class="section-label">ДОПОЛНИТЕЛЬНЫЕ ЮРИСДИКЦИИ</div><h2 class="section-title-main">Специализированные use cases</h2></div>
        <div class="jur-relevance-grid">
          <a class="jur-relevance-card" href="/ru/yurisdikcii/estoniya.html"><h4>Эстония</h4><p>Digital · SaaS · remote business models</p></a>
          <a class="jur-relevance-card" href="/ru/yurisdikcii/irlandiya.html"><h4>Ирландия</h4><p>Technology · IP · R&amp;D · EU–US operations</p></a>
          <a class="jur-relevance-card" href="/ru/yurisdikcii/velikobritaniya.html"><h4>Великобритания</h4><p>International business · investment · operating structures</p></a>
          <a class="jur-relevance-card" href="/ru/yurisdikcii/shveycariya.html"><h4>Швейцария</h4><p>Private capital · HQ · founder and family structures</p></a>
        </div>
      </div>
    </section>

    <section class="section section-light">
      <div class="container container-narrow">
        <div class="section-label">КАК МЫ РАБОТАЕМ</div>
        <h2 class="section-title-main">Function before jurisdiction</h2>
        <p>LEXONYX оценивает юрисдикцию как часть общей бизнес-архитектуры: ownership, роль компании, management, functions, operational reality, banking и implementation requirements. По украинскому праву юридическая помощь оказывается непосредственно Advokat (Ukraine). Jurisdiction-specific legal, tax и regulatory conclusions по другим странам предоставляются или подтверждаются соответствующими квалифицированными local professionals и интегрируются LEXONYX в общий Target State.</p>
      </div>
    </section>
  </main>'''
          s = re.sub(r'<main id="main-content".*?</main>', main, s, count=1, flags=re.S)
          hub.write_text(s, encoding='utf-8')

          # Create Germany / Ukraine pages from Poland shell, replacing only head/main and language switch references.
          shell = (root/'ru/yurisdikcii/polsha.html').read_text(encoding='utf-8')

          def build_country(path, country, slug, seo_title, meta, eyebrow, title, subtitle, roles_html, interfaces_html, notuse_html, ua_direct=False):
              s = shell
              s = re.sub(r'<title>.*?</title>', f'<title>{seo_title}</title>', s, count=1, flags=re.S)
              s = re.sub(r'<meta name="description"\s*content=".*?">', f'<meta name="description" content="{meta}">', s, count=1, flags=re.S)
              s = re.sub(r'<link rel="canonical" href=".*?">', f'<link rel="canonical" href="https://lexonyx.com/ru/yurisdikcii/{slug}.html">', s, count=1)
              s = re.sub(r'<meta property="og:url" content=".*?">', f'<meta property="og:url" content="https://lexonyx.com/ru/yurisdikcii/{slug}.html">', s, count=1)
              s = re.sub(r'<meta property="og:title" content=".*?">', f'<meta property="og:title" content="{seo_title}">', s, count=1)
              s = re.sub(r'<meta property="og:description"\s*content=".*?">', f'<meta property="og:description" content="{meta}">', s, count=1, flags=re.S)
              s = re.sub(r'<meta name="twitter:title" content=".*?">', f'<meta name="twitter:title" content="{seo_title}">', s, count=1)
              s = re.sub(r'<meta name="twitter:description"\s*content=".*?">', f'<meta name="twitter:description" content="{meta}">', s, count=1, flags=re.S)
              s = re.sub(r'https://lexonyx\.com/ru/yurisdikcii/polsha\.html', f'https://lexonyx.com/ru/yurisdikcii/{slug}.html', s)
              s = re.sub(r'/ru/yurisdikcii/polsha\.html', f'/ru/yurisdikcii/{slug}.html', s)
              # keep EN/UK links temporarily at hubs until Phase 4 i18n pages are created
              scope = ('По украинскому праву LEXONYX оказывает юридическую помощь непосредственно в пределах профессионального допуска Advokat (Ukraine). Вопросы права и налогообложения других юрисдикций координируются с соответствующими local professionals.' if ua_direct else 'LEXONYX ведёт structural and factual analysis. Конкретные выводы по немецкому или иному local law, tax и regulation подтверждаются соответствующими квалифицированными специалистами и интегрируются в общую архитектуру проекта.')
              main = f'''<main id="main-content">
    <section class="hero-home hero-page hero-service hero-bg-dark">
      <div class="container"><div class="hero-content-home">
        <div class="hero-eyebrow-home">{eyebrow}</div><h1 class="hero-title-home">{title}</h1>
        <p class="hero-subtitle-home">{subtitle}</p>
        <div class="hero-actions" style="margin-top:40px"><a href="/ru/zaprosit-razbor.html" class="btn btn-primary btn-lg">Запросить разбор</a><a href="/ru/yurisdikcii/" class="btn btn-secondary btn-lg">Все юрисдикции</a></div>
      </div></div>
    </section>
    <nav class="breadcrumbs" aria-label="Breadcrumb"><div class="container"><a href="/ru/index.html">Главная</a><span class="separator">›</span><a href="/ru/yurisdikcii/">Юрисдикции</a><span class="separator">›</span><span class="current">{country}</span></div></nav>
    <section class="section section-light"><div class="container"><div class="section-header-centered"><div class="section-label">ТИПИЧНЫЕ РОЛИ</div><h2 class="section-title-main">Когда {country} становится частью Target State</h2></div><div class="jur-relevance-grid">{roles_html}</div></div></section>
    <section class="section section-dark"><div class="container container-narrow"><div class="section-label">STRUCTURAL INTERFACES</div><h2 class="section-title-main">Что нужно проверить до реализации</h2>{interfaces_html}</div></section>
    <section class="section section-light"><div class="container container-narrow"><div class="section-label">WHEN NOT TO USE</div><h2 class="section-title-main">Когда юрисдикцию не следует добавлять автоматически</h2>{notuse_html}</div></section>
    <section class="section section-dark"><div class="container container-narrow"><div class="section-label">КАК РАБОТАЕТ LEXONYX</div><h2 class="section-title-main">Architecture + specialist layer</h2><p>{scope}</p></div></section>
  </main>'''
              s = re.sub(r'<main id="main-content".*?</main>', main, s, count=1, flags=re.S)
              Path(path).write_text(s, encoding='utf-8')

          build_country('ru/yurisdikcii/ukraina.html','Украина','ukraina','Украина и международный бизнес — LEXONYX','Украинское право и международная структурная архитектура для предпринимателей, собственников и компаний, ведущих бизнес между Украиной, Германией, ЕС и другими юрисдикциями.','UKRAINE · CROSS-BORDER','Украина в международной структуре бизнеса','Украинское право + международная архитектура в одном Matter. LEXONYX сопровождает украинских предпринимателей, собственников и компании при построении, изменении и защите международной бизнес-структуры.',
          '''<div class="jur-relevance-card"><h4>Ukraine → Germany / EU</h4><p>Founder relocates, while Ukrainian company, assets or operations remain part of the structure.</p></div><div class="jur-relevance-card"><h4>Ownership & restructuring</h4><p>Ukrainian corporate-law workstream inside a wider cross-border transaction.</p></div><div class="jur-relevance-card"><h4>Investor entry</h4><p>Investment into Ukrainian or international group with Ukrainian assets/functions.</p></div><div class="jur-relevance-card"><h4>Banking / SoF / SoW</h4><p>Reconstruction of origin of funds, business history and evidence for EU banks.</p></div>''',
          '''<p>Ownership and shareholder rights · Ukrainian corporate law · founder relocation facts · management and control · CFC/residence interfaces · banking and SoF/SoW · foreign HoldCo necessity · IP and transaction workstreams.</p>''',
          '''<p>International activity or EU clients do not automatically require replacing a Ukrainian company with a foreign HoldCo. A new entity should be created only where it has an independent function and a defensible Business Purpose.</p>''',True)

          build_country('ru/yurisdikcii/germaniya.html','Германия','germaniya','Германия в международной структуре бизнеса — LEXONYX','Структурирование международного бизнеса с немецким nexus: founders, management, operating companies, workforce, banking, investment и coordination of German legal and tax workstreams.','GERMANY · OPERATING REALITY','Германия в международной структуре бизнеса','Germany often becomes structurally relevant because management, people, customers or operations are actually located there. LEXONYX maps that reality and coordinates the German specialist workstreams required for a defensible Target State.',
          '''<div class="jur-relevance-card"><h4>Principal OpCo</h4><p>Когда management, customer contracting и предпринимательские функции реально находятся в Германии.</p></div><div class="jur-relevance-card"><h4>Management centre</h4><p>Foreign entity может иметь существенный German nexus, если executive decisions принимаются из Германии.</p></div><div class="jur-relevance-card"><h4>EU operating platform</h4><p>Employees, sales, customers, contracting and banking form a real German operating footprint.</p></div><div class="jur-relevance-card"><h4>Founder residence interface</h4><p>Personal residence and ownership need to be analysed together with corporate structure.</p></div>''',
          '''<p>Management / corporate residence · PE indicators · founder taxation interfaces · CFC · workforce and payroll · VAT · investor rights · banking/KYC. LEXONYX builds the factual and structural map; German-law and German-tax conclusions are confirmed by qualified German professionals.</p>''',
          '''<p>Germany should not be “designed away” on paper if the founder continues to manage from Germany, key people are located there and material decisions are taken there. A nominal foreign principal company does not by itself remove German operational reality.</p>''',False)

          print('Changed', len(changed), 'RU navigation files and jurisdiction hub/new pages')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ru
          if ! git diff --cached --quiet; then
            git commit -m "Implement Phase 3A jurisdiction architecture"
            git push
          fi
