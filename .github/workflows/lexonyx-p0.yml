name: Lexonyx Phase 1 P0 patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lexonyx-p0.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply P0 patch
        run: python scripts/lexonyx_p0_patch.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Apply Phase 1 P0 compliance and URL fixes"
            git push
          fi
