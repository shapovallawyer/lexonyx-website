name: Final predeploy QA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/final-predeploy-qa.yml']
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix hreflang and thank-you robots, then audit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, urllib.parse

          root=Path('.')
          changed=[]

          # 1) x-default must equal the EN alternate wherever an EN alternate exists.
          for p in list(root.glob('ru/**/*.html'))+list(root.glob('en/**/*.html'))+list(root.glob('uk/**/*.html')):
              s=p.read_text(encoding='utf-8')
              tags=re.findall(r'<link\b[^>]*hreflang=["\'](?:en|x-default)["\'][^>]*>', s, flags=re.I)
              en_url=None
              for tag in tags:
                  if re.search(r'hreflang=["\']en["\']', tag, re.I):
                      m=re.search(r'href=["\']([^"\']+)["\']', tag, re.I)
                      if m: en_url=m.group(1)
              if en_url:
                  def repl(m):
                      tag=m.group(0)
                      if not re.search(r'hreflang=["\']x-default["\']',tag,re.I): return tag
                      if re.search(r'href=["\'][^"\']+["\']',tag,re.I):
                          return re.sub(r'href=["\'][^"\']+["\']', f'href="{en_url}"', tag, count=1, flags=re.I)
                      return tag
                  ns=re.sub(r'<link\b[^>]*hreflang=["\']x-default["\'][^>]*>', repl, s, flags=re.I)
                  if ns!=s:
                      p.write_text(ns,encoding='utf-8'); changed.append(str(p))

          # 2) Thank-you confirmation pages must not be indexed.
          for rel in ['en/intake/thank-you.html','uk/intake/dyakuyemo.html']:
              p=root/rel
              s=p.read_text(encoding='utf-8')
              ns=re.sub(r'(<meta\s+name=["\']robots["\']\s+content=["\'])index,follow(["\'])',r'\1noindex,follow\2',s,flags=re.I)
              if ns!=s:
                  p.write_text(ns,encoding='utf-8'); changed.append(rel)

          # Parse redirect source paths as valid internal endpoints.
          redirect_sources=set()
          for line in (root/'_redirects').read_text(encoding='utf-8').splitlines():
              line=line.strip()
              if not line or line.startswith('#'): continue
              parts=line.split()
              if parts and parts[0].startswith('/'):
                  redirect_sources.add(parts[0].rstrip('!'))

          def path_exists(urlpath):
              path=urllib.parse.urlsplit(urlpath).path
              if path in redirect_sources: return True
              q=path.lstrip('/')
              if not q: return (root/'index.html').exists()
              candidate=root/q
              if candidate.is_file(): return True
              if candidate.is_dir() and (candidate/'index.html').is_file(): return True
              if path.endswith('/') and (root/q/'index.html').is_file(): return True
              # Netlify pretty-directory convention only; do not invent unrelated routes.
              return False

          # 3) sitemap target existence.
          sm=(root/'sitemap.xml').read_text(encoding='utf-8')
          locs=re.findall(r'<loc>https?://[^/]+([^<]*)</loc>',sm,re.I)
          sitemap_missing=[u for u in locs if not path_exists(u)]

          # 4) Internal href/src existence. Ignore anchors, mail/tel/javascript/data and external URLs.
          missing={}
          htmls=list(root.glob('ru/**/*.html'))+list(root.glob('en/**/*.html'))+list(root.glob('uk/**/*.html'))+[root/'404.html']
          for p in htmls:
              s=p.read_text(encoding='utf-8')
              vals=re.findall(r'(?:href|src)=["\']([^"\']+)["\']',s,re.I)
              bad=[]
              for v in vals:
                  if not v or v.startswith(('#','mailto:','tel:','javascript:','data:','http://','https://','//')): continue
                  if not v.startswith('/'):
                      # Resolve relative path against page directory.
                      v='/' + str((p.parent/urllib.parse.urlsplit(v).path).resolve().relative_to(root.resolve())).replace('\\','/')
                  if not path_exists(v): bad.append(v)
              if bad: missing[str(p)]=sorted(set(bad))

          # 5) Basic form endpoints.
          form_issues=[]
          for rel in ['ru/zaprosit-razbor.html','en/request-review.html','uk/zapytaty-rozbir.html']:
              p=root/rel; s=p.read_text(encoding='utf-8')
              m=re.search(r'<form\b[^>]*action=["\']([^"\']+)["\'][^>]*>',s,re.I)
              if not m or not path_exists(m.group(1)): form_issues.append(f'{rel}: invalid/missing action')
              if 'data-netlify="true"' not in s and "data-netlify='true'" not in s: form_issues.append(f'{rel}: data-netlify missing')
              if 'name="form-name"' not in s and "name='form-name'" not in s: form_issues.append(f'{rel}: hidden form-name missing')

          report=[]
          report.append('LEXONYX FINAL PREDEPLOY QA')
          report.append('CHANGED_FILES='+str(len(set(changed))))
          report.extend('CHANGED '+x for x in sorted(set(changed)))
          report.append('SITEMAP_MISSING='+str(len(sitemap_missing)))
          report.extend('SITEMAP_MISSING '+x for x in sitemap_missing)
          report.append('FORM_ISSUES='+str(len(form_issues)))
          report.extend('FORM_ISSUE '+x for x in form_issues)
          total_missing=sum(len(v) for v in missing.values())
          report.append('INTERNAL_MISSING='+str(total_missing))
          for f, vals in sorted(missing.items()):
              for v in vals: report.append(f'MISSING {f} -> {v}')
          (root/'docs/PREDEPLOY_QA.txt').write_text('\n'.join(report)+'\n',encoding='utf-8')

          print('\n'.join(report))
          PY
      - name: Commit QA fixes/report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ru en uk docs/PREDEPLOY_QA.txt
          if ! git diff --cached --quiet; then
            git commit -m "Apply final pre-deploy QA fixes"
            git push
          fi
