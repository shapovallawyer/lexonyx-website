<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10151a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2530;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" fill="url(#bg)" rx="12"/>
  
  <!-- LEX monogram -->
  <text x="32" y="44" 
        font-family="Georgia, serif" 
        font-size="32" 
        font-weight="500" 
        fill="#c6a46e" 
        text-anchor="middle">LEX</text>
  
  <!-- Accent line -->
  <line x1="20" y1="50" x2="44" y2="50" stroke="#c6a46e" stroke-width="1.5"/>
</svg>
